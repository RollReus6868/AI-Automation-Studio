<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suno giả — Create</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 0; display: flex; }
  aside { width: 200px; padding: 12px; }
  main { flex: 1; padding: 12px; display: flex; gap: 16px; }
  .form { width: 380px; }
  textarea, [contenteditable] { width: 100%; min-height: 60px; background: #222; color: #eee; border: 1px solid #444; display: block; margin: 6px 0; }
  [role="tab"][aria-selected="true"] { background: #555; }
  .ds { flex: 1; }
  [data-testid="clip-row"] { display: flex; gap: 10px; align-items: center; padding: 6px; border-bottom: 1px solid #333; position: relative; }
  .bia { width: 48px; height: 48px; background: #345; position: relative; }
  .bia span { position: absolute; bottom: 0; right: 0; font-size: 11px; }
  [role="menu"] { position: absolute; right: 0; top: 40px; background: #333; z-index: 5; min-width: 160px; }
  [role="menu"] [role="menuitem"] { display: block; padding: 6px 10px; }
  .toast { position: fixed; bottom: 10px; left: 10px; }
</style>
</head>
<body>
<!--
  Trang Suno GIẢ cho e2e (node tests/e2e.js suno). Chép cấu trúc trang Create thật (lưu 15/10/2026):
  tablist "What to create" + "Create form mode", ô Styles trong create-form-styles-wrapper (chỉ hiện ở
  Advanced), ô "Lyrics editor" (contenteditable, CÓ SẴN lời cũ — app phải xoá), nút "Clear all form inputs",
  nút "Create song" (data-disabled khi Styles trống), hàng bài clip-row (data-clip-status, /song/<id>,
  thời lượng m:ss trên ảnh bìa, nút "More options" → Download → hộp chọn định dạng (M4A chọn sẵn, MP3, WAV…) → nút Download).
  Bài lưu ở MÁY CHỦ test theo tài khoản (cookie suno_tk). Một lần Create ra 4 bài: 2 bài đủ dài + 2 bản nghe thử
  (bài 3 dài 4:00 làm mồi — app không được xét). Máy chủ bật được "hết lượt tải" / "hết credit" cho từng tài khoản.
-->
<aside id="ben"></aside>
<main>
  <section class="form">
    <div role="tablist" aria-label="What to create"><button role="tab" aria-selected="true">Songs</button><button role="tab" aria-selected="false">Speech</button></div>
    <div role="tablist" aria-label="Create form mode"><button role="tab" id="tabSimple" aria-selected="true">Simple</button><button role="tab" id="tabAdv" aria-selected="false">Advanced</button></div>
    <button aria-label="Clear all form inputs" id="nutXoa">⟲</button>
    <div id="simple"><textarea placeholder="Describe the song you want"></textarea></div>
    <div id="adv" hidden>
      <div aria-label="Lyrics editor" contenteditable="true" id="loi">[Verse] lời bài cũ còn sót</div>
      <div data-testid="create-form-styles-wrapper"><textarea id="styles" placeholder="Enter style of music, bpm…"></textarea></div>
    </div>
    <button aria-label="Create song" id="nutTao" data-disabled="">Create</button>
  </section>
  <section class="ds" id="ds"></section>
</main>
<div class="toast" id="suno-toast-viewport-bottom"></div>
<script>
  const tk = (document.cookie.match(/(?:^|; )suno_tk=([^;]+)/) || [])[1] || '';
  const $ = (s) => document.querySelector(s);
  $('#ben').innerHTML = tk ? '<button data-testid="profile-menu-button">' + tk + '</button>' : '<button>Sign in</button>';
  let cauHinh = { hetTai: [], hetTao: [] };

  function chonTab(nhom, tab) {
    for (const t of nhom.querySelectorAll('[role="tab"]')) t.setAttribute('aria-selected', String(t === tab));
  }
  for (const nhom of document.querySelectorAll('[role="tablist"]')) {
    nhom.addEventListener('click', (e) => { const t = e.target.closest('[role="tab"]'); if (t) chonTab(nhom, t); veForm(); });
  }
  function veForm() {
    const adv = $('#tabAdv').getAttribute('aria-selected') === 'true';
    $('#simple').hidden = adv; $('#adv').hidden = !adv;
    if ($('#styles').value.trim()) $('#nutTao').removeAttribute('data-disabled'); else $('#nutTao').setAttribute('data-disabled', '');
    // Video người dùng 16/10/2026: hết credit trong ngày → nút Create đổi chữ "Create again in 9:44:35" (đếm ngược
    // tới 0h UTC), aria-label vẫn "Create song", bấm không tạo gì.
    $('#nutTao').textContent = (cauHinh.choTaoLai || []).includes(tk) ? 'Create again in 9:44:35' : 'Create';
  }
  $('#styles').addEventListener('input', veForm);
  $('#nutXoa').onclick = () => { $('#styles').value = ''; $('#loi').textContent = ''; veForm(); };
  function toast(chu) { const t = $('#suno-toast-viewport-bottom'); t.textContent = chu; clearTimeout(toast.h); toast.h = setTimeout(() => { t.textContent = ''; }, 8000); }

  $('#nutTao').onclick = async () => {
    if ($('#nutTao').hasAttribute('data-disabled') || /again/.test($('#nutTao').textContent)) return;
    const r = await (await fetch('/__suno-tao', { method: 'POST', body: JSON.stringify({
      tk, styles: $('#styles').value, loi: $('#loi').innerText.trim(), cheDo: $('#tabAdv').getAttribute('aria-selected') === 'true' ? 'advanced' : 'simple'
    }) })).json();
    if (r.loi) toast('Not enough credits. Upgrade to Pro to get more credits.');
    nap();
  };

  const mmss = (g) => Math.floor(g / 60) + ':' + String(g % 60).padStart(2, '0');
  let menuMo = '';
  let lanNap = 0;
  async function nap() {
    // Lần nạp đầu có thể chậm (máy chủ giữ lại treoDs ms) — như Suno thật: form hiện trước, danh sách bài nạp sau.
    const r = await (await fetch('/__suno-ds?tk=' + encodeURIComponent(tk) + (lanNap++ ? '' : '&dau=1'))).json();
    cauHinh = r;
    veForm();
    const html = r.clips.map((c) => `<div data-testid="clip-row" data-clip-status="${c.trangThai}" aria-label="${c.ten}">
        <div class="bia">${c.trangThai === 'complete' ? `<span>${mmss(c.giay)}</span>` : ''}</div>
        <a href="/song/${c.id}">${c.ten}</a>${c.thu ? '<small>Upgrade for full song</small>' : ''}
        <button aria-label="More options" data-id="${c.id}">⋯</button>
        ${menuMo === c.id ? `<div role="menu"><div role="menuitem">Remix ›</div><div role="menuitem">Edit ›</div><div role="menuitem">Publish</div>
          <div role="menuitem">Share</div><div role="menuitem" data-tai="${c.id}">🔒 Download</div><div role="menuitem">Manage ›</div>
          <div role="menuitem">Add to Queue</div><div role="menuitem">Move to Trash</div></div>` : ''}
      </div>`).join('');
    if ($('#ds').__h !== html) { $('#ds').__h = html; $('#ds').innerHTML = html; }
  }
  $('#ds').addEventListener('click', (e) => {
    const m = e.target.closest('button[aria-label="More options"]');
    if (m) { menuMo = menuMo === m.dataset.id ? '' : m.dataset.id; nap(); return; }
    const t = e.target.closest('[data-tai]');
    if (t) { menuMo = ''; moHop(t.dataset.tai).then(nap); }
  });
  // Hộp "Download '<tên>'" như Suno thật (15/10/2026): chọn định dạng rồi bấm nút Download to.
  // Định dạng chọn sẵn là M4A (Suno nhớ lựa chọn lần trước) → app phải tự chọn MP3.
  let dinhDang = 'M4A';
  async function moHop(id) {
    // Máy chủ bật "hongTai": hộp mở ra mà không có nút tải nào bấm được (như bản 1.2.3 gặp nút lạ) — app phải tải lại.
    const hong = (await (await fetch('/__suno-hong', { method: 'POST' })).json()).hong;
    // Hết lượt tải: Suno thật (ảnh 15/10/2026) KHÔNG mở hộp chọn định dạng mà mở hộp "Out of Downloads".
    // Ở đây cố ý KHÔNG gắn role=dialog — app phải nhận ra bằng chữ.
    if (cauHinh.hetTai.includes(tk)) {
      const h = document.createElement('div');
      h.id = 'hopHetTai'; h.style.cssText = 'position:fixed;left:30%;top:15%;background:#222;padding:20px;z-index:9;width:380px';
      h.innerHTML = `<button aria-label="Close">✕</button><h2>Out of Downloads</h2>
        <p>You don't have any downloads left. Subscribe for a monthly allowance, or buy downloads for the songs you want. <a href="#">Learn more.</a></p>
        <div><div>Plan<br><b>Free</b></div><div>Downloads<br><b>0</b></div></div>
        <div><b>Pro Plan</b> <span>$10 /month</span><ul><li>Access to our best models</li><li>2,500 credits per month</li><li>20 song downloads per month</li><li>Commercial use rights</li></ul>
        <button>Upgrade to Pro Plan</button></div><button>Buy download packs</button>
        <div>https://suno.com/song/${id} <button>Copy share link</button></div>`;
      h.querySelector('[aria-label="Close"]').onclick = () => h.remove();
      document.body.appendChild(h);
      return;
    }
    const het = false;
    const c = document.createElement('div');
    c.setAttribute('role', 'dialog'); c.id = 'hopTai';
    c.style.cssText = 'position:fixed;left:30%;top:20%;background:#222;padding:20px;z-index:9';
    // Suno 16/10/2026 (ảnh người dùng): bài chưa mở khoá → nút "Unlock & Download", chân hộp "Plan Free · Downloads 7".
    // moKhoa === 'nut': bấm Unlock chỉ mở khoá ("Unlocking song...") rồi hộp đổi sang nút "Download “<tên>”" — phải bấm tiếp.
    const daMo = () => (cauHinh.daMo || []).includes(id);
    let dangMo = false;
    // moKhoa === 'chuanBi' (video người dùng 16/10/2026, Suno thật): mở hộp → nút "Unlock & Download" mờ và ô
    // "Downloads" chưa có số trong tatMs ms; bấm → nút "Preparing..." mờ, ô MP3 quay vòng, chân hộp "You've
    // unlocked this song…"; ~40 s sau Suno tự tải file và đóng hộp (ở đây chuanBiMs).
    const CB = cauHinh.moKhoa === 'chuanBi';
    let sanSang = !CB || !cauHinh.tatMs, chuanBi = false;
    if (!sanSang) setTimeout(() => { sanSang = true; if (c.isConnected) ve(); }, cauHinh.tatMs);
    const ve = () => {
      if (CB && !hong) {
        c.innerHTML = `<button aria-label="Close" data-dong>✕</button><h2>Download 'Bai ${id}'</h2>` +
          ['M4A', 'MP3', 'WAV', 'MP4 video asset'].map((d) => `<button data-dd="${d}">${d}${d === dinhDang ? (chuanBi ? '<span aria-busy="true"></span>' : ' ✓') : ''}</button>`).join('') +
          `<div><span>Stems &amp; MIDI</span> <button>Manage</button></div>` +
          (chuanBi ? '<button data-tai-ve data-disabled="" disabled>Preparing...</button><p>You\'ve unlocked this song. You can return and download at any time. Learn more.</p>'
            : `<button data-tai-ve ${sanSang ? '' : 'data-disabled="" disabled'}>Unlock &amp; Download</button><div><div>Plan<br>Free</div><div>Downloads<br>${sanSang ? '5' : ''}</div></div>`);
        return;
      }
      if (hong) { c.innerHTML = `<button aria-label="Close" data-dong>✕</button><h2>Download 'Bai ${id}'</h2><p>Loading…</p>`; return; }
      if (cauHinh.moKhoa === 'nut' && daMo() && dangMo) {
        c.innerHTML = `<button aria-label="Close" data-dong>✕</button><h2>Download 'Bai ${id}'</h2><button data-tai-ve>Download “Bai ${id}”</button>`;
        return;
      }
      c.innerHTML = `<button aria-label="Close" data-dong>✕</button><h2>Download 'Bai ${id}'</h2>` +
        ['M4A', 'MP3', 'WAV', 'MP4 video asset'].map((d) => `<button data-dd="${d}">${d}${d === dinhDang ? ' ✓' : ''}</button>`).join('') +
        `<div><span>Stems &amp; MIDI</span> <button>Manage</button></div>` +
        `<button data-tai-ve ${het ? 'aria-disabled="true" data-disabled=""' : ''}>${daMo() ? 'Download' : 'Unlock &amp; Download'}</button>` +
        (daMo() ? `<p>You've unlocked this song. You can return and download at any time. Learn more.</p>` : `<div><div>Plan<br>Free</div><div>Downloads<br>7</div></div>`);
    };
    ve();
    c.onclick = (e) => {
      const d = e.target.closest('[data-dd]');
      if (d) { dinhDang = d.dataset.dd; ve(); return; }
      if (e.target.closest('[data-dong]')) { c.remove(); return; }
      const b = e.target.closest('[data-tai-ve]');
      if (b && !b.hasAttribute('data-disabled') && CB) {
        chuanBi = true; ve();
        fetch('/__suno-mo-khoa/' + id, { method: 'POST' });
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = '/__suno-mp3/' + id + '?dd=' + encodeURIComponent(dinhDang); a.download = '';
          document.body.appendChild(a); a.click(); a.remove();
          c.remove();
        }, cauHinh.chuanBiMs || 0);
        return;
      }
      if (b && !b.hasAttribute('data-disabled') && cauHinh.moKhoa === 'nut' && !daMo()) {
        b.textContent = 'Unlocking song...';
        fetch('/__suno-mo-khoa/' + id, { method: 'POST' }).then(() => nap()).then(() => { dangMo = true; ve(); });
        return;
      }
      if (b && !b.hasAttribute('data-disabled')) {
        const a = document.createElement('a');
        a.href = '/__suno-mp3/' + id + '?dd=' + encodeURIComponent(dinhDang); a.download = '';
        document.body.appendChild(a); a.click(); a.remove();
      }
    };
    document.body.appendChild(c);
  }
  $('#ds').addEventListener('mouseover', () => {});
  veForm();
  nap();
  setInterval(nap, 500);
</script>
</body>
</html>
