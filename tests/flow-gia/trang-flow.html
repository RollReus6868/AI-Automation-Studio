<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Google Flow giả</title>
<style>body{font-family:sans-serif;background:#111;color:#eee}.ProseMirror{min-height:60px;border:1px solid #555;padding:6px}</style>
</head><body>
<script>
  // Trang chủ Flow: nút "Dự án mới" → trang dự án có ô nhập prompt (ProseMirror).
  if (/\/project\//.test(location.pathname)) {
    document.body.innerHTML = '<h3>Dự án Flow giả</h3><div class="ProseMirror" contenteditable="true"><p><br></p></div>' +
      '<button aria-label="Tạo">Tạo</button><div id="luoi"></div>';
    // Flow mới (cookie flow_upload_moi=1): [+] "Add media" (mở bằng pointerdown) → menu → "Upload image" TẠO ô chọn
    // file không gắn vào trang rồi mở hộp chọn file. Ảnh nhận được vào kho (localStorage, tên = tên file bỏ đuôi).
    if (/(^|;\s*)flow_upload_moi=1/.test(document.cookie)) {
      const nut = document.createElement('button');
      nut.setAttribute('aria-label', 'Add media');
      nut.innerHTML = '<i class="google-symbols">add_2</i>';
      document.querySelector('.ProseMirror').after(nut);
      nut.addEventListener('pointerdown', () => {
        if (document.querySelector('[role="menu"]')) return;
        const m = document.createElement('div');
        m.setAttribute('role', 'menu');
        m.innerHTML = '<button role="menuitem"><i class="google-symbols">search</i>Search assets</button>' +
          '<button role="menuitem" class="tai"><i class="google-symbols">upload</i>Upload image</button>';
        document.body.appendChild(m);
        m.querySelector('.tai').addEventListener('click', () => {
          const i = document.createElement('input');
          i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
          i.addEventListener('change', async () => {
            const ds = [];
            for (const f of i.files) ds.push({ ten: f.name, co: (await f.arrayBuffer()).byteLength });
            const kho = JSON.parse(localStorage.getItem('khoAnhFlow') || '[]');
            localStorage.setItem('khoAnhFlow', JSON.stringify([...new Set([...kho, ...ds.filter((x) => x.co > 0).map((x) => x.ten.replace(/\.[^.]+$/, ''))])]));
            fetch('/__flow-ghi', { method: 'POST', body: JSON.stringify({ loai: 'tai-len-trang', d: { files: ds }, url: location.href }) }).catch(() => {});
            m.remove();
          });
          i.click();
        });
      });
    }
  } else if (/(^|;\s*)flow_dang_xuat=1/.test(document.cookie)) {
    // Chưa đăng nhập: Google đưa sang trang đăng nhập (ngoài /fx/ → app coi là ngoài Flow).
    location.replace(location.href.replace(/\/fx\/.*/, '/signin/v2/identifier'));
  } else {
    const goc = location.pathname.replace(/\/$/, '');
    // Cookie flow_mo_du_an_cu=<mã>: lần đầu tab vào trang chủ, Flow tự mở lại dự án cũ đó (app phải tự về trang chủ
    // rồi bấm "+ Dự án mới", không được dùng dự án cũ).
    const cu = (document.cookie.match(/(?:^|;\s*)flow_mo_du_an_cu=([^;]+)/) || [])[1];
    if (cu && !sessionStorage.getItem('daMoDuAnCu')) { sessionStorage.setItem('daMoDuAnCu', '1'); location.replace(goc + '/project/' + cu); }
    // Như Flow thật (ảnh người dùng 17/10/2026): nút "+ Dự án mới" NỔI giữa đáy trang chủ (chính nút là
    // position:fixed → offsetParent = null), biểu tượng là CHỮ (font google-symbols) dính liền nhãn trong thẻ
    // riêng → innerText "add_2Dự án mới" (không có dấu cách).
    document.body.innerHTML = '<h3>Flow</h3><div id="dsDuAn"></div>' +
      '<button id="moi" style="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:30px 50px"><i class="google-symbols">add_2</i><span>Dự án mới</span></button>';
    document.getElementById('moi').onclick = async () => {
      const id = 'gia-' + Math.random().toString(36).slice(2, 8);
      await fetch('/__flow-du-an', { method: 'POST', body: JSON.stringify({ id }) }).catch(() => {});
      location.href = goc + '/project/' + id;
    };
    // Danh sách dự án (lưu ở máy chủ test). Thẻ kiểu Flow 10/2026 (nhật ký 18/10: chữ thẻ "Tháng 10 17 - 20:27 edit delete"):
    // không còn nút ⋮, hai nút biểu tượng nằm ngay trong liên kết của thẻ — "edit" (đổi tên → hộp "Huỷ / Lưu", bấm nhầm là
    // bài đỏ) và "delete" → hộp xác nhận "Huỷ / Xoá" → máy chủ xoá. Thẻ "gia-khac" kiểu cũ (nút ⋮ chỉ nhận pointerdown,
    // như Radix → menu "Delete project" → hộp "Cancel / Delete").
    const ve = async () => {
      const ds = await (await fetch('/__flow-du-an')).json();
      const h = document.getElementById('dsDuAn');
      h.innerHTML = ds.map((id) => id === 'gia-khac'
        ? `<div class="the" style="border:1px solid #444;margin:6px;padding:6px">
        <a href="${goc}/project/${id}">Dự án ${id}</a>
        <button class="tuy" aria-label="More options" data-id="${id}"><i class="google-symbols">more_vert</i></button></div>`
        : `<div class="the" style="border:1px solid #444;margin:6px;padding:6px">
        <a href="${goc}/project/${id}"><div style="width:120px;height:60px;background:#333"></div><div>Tháng 10 17 - 20:27</div>
        <div><button class="sua" data-id="${id}"><i class="google-symbols">edit</i></button><button class="xoa-the" data-id="${id}"><i class="google-symbols">delete</i></button></div></a></div>`).join('');
      for (const b of h.querySelectorAll('.tuy')) b.addEventListener('pointerdown', () => moMenu(b.dataset.id, b));
      for (const b of h.querySelectorAll('.sua')) b.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        const d = document.createElement('div');
        d.setAttribute('role', 'dialog');
        d.innerHTML = '<p>Đổi tên dự án</p><input value="x"><button class="huy">Huỷ</button><button>Lưu</button>';
        document.body.appendChild(d);
        d.querySelector('.huy').onclick = () => d.remove();
      });
      for (const b of h.querySelectorAll('.xoa-the')) b.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        hoiXoa(b.dataset.id, 'Xoá dự án?', 'Huỷ', 'Xoá');
      });
    };
    const hoiXoa = (id, cau, huy, xoa) => {
      const d = document.createElement('div');
      d.setAttribute('role', 'alertdialog');
      d.innerHTML = `<p>${cau}</p><button class="huy">${huy}</button><button class="ok">${xoa}</button>`;
      document.body.appendChild(d);
      d.querySelector('.huy').onclick = () => d.remove();
      d.querySelector('.ok').onclick = async () => {
        await fetch('/__flow-xoa-du-an', { method: 'POST', body: JSON.stringify({ id }) }).catch(() => {});
        d.remove(); ve();
      };
    };
    const moMenu = (id, b) => {
      document.querySelectorAll('[role="menu"]').forEach((m) => m.remove());
      const m = document.createElement('div');
      m.setAttribute('role', 'menu');
      m.innerHTML = '<button role="menuitem"><i class="google-symbols">edit</i> Rename</button>' +
        '<button role="menuitem" class="xoa"><i class="google-symbols">delete</i> Delete project</button>';
      b.parentElement.appendChild(m);
      m.querySelector('.xoa').addEventListener('click', () => {
        m.remove();
        hoiXoa(id, 'Delete project?', 'Cancel', 'Delete');
      });
    };
    ve();
  }
</script>
</body></html>
