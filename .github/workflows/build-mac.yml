# ============================================================================
#  Dong goi macOS tren may Mac cua GitHub (mien phi)
#  Ra 2 file: AIAutomationStudio-<ver>-mac-arm64.zip (chip Apple) va -mac-x64.zip (Intel)
# ============================================================================
name: Dong goi macOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache thu muc npm theo package-lock.json (npm ci van cai lai node_modules, chi bot tai tu mang).
          cache: npm

      - name: Cai thu vien
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund; fi

      - name: Kiem thu logic + tu cap nhat
        run: npm test

      # Muse tren Windows CI ~500 s (18-22/10/2026), sat han cung 720 s cua tests/e2e.js -> nang han cung len 1000 s
      # (han chong treo, khong phai bai do toc do); han buoc phai dai hon han cung de log "E2E: QUA GIO" kip in ra.
      - name: Kiem thu dau-cuoi (trang Muse gia)
        timeout-minutes: 20
        env:
          E2E_HAN_GIAY: '1000'
        run: node tests/e2e.js

      # Google Flow trong hang doi + noi Flow <-> Muse (trang + engine Flow gia)
      # KHONG tu chay lai buoc nay khi do: cac lan do 18/10 + 22/10/2026 (#2/#3 "Flow tao xong nhung khong tai ve duoc")
      # la loi dua THAT cua app (luong Flow chot me ~3 s sau AUTOMATION_STOPPED khi file con dang tai, Windows quet virus
      # file vua tai lam "done" toi muon; da sua o 1.4.6: luong-flow cho file dang tai) - chay lai cho xanh la che loi. Do thi xem dong "(i)" (ky hieu \u24D8) + artifact anh-chup-*.
      - name: Kiem thu dau-cuoi (trang Flow gia)
        timeout-minutes: 10
        run: node tests/e2e.js flow

      # Muc Tao nhac: trang Suno Create gia (chon bai dai hon, het luot -> tai khoan Suno phu)
      - name: Kiem thu dau-cuoi (trang Suno gia)
        timeout-minutes: 10
        run: node tests/e2e.js suno

      # 1.4.0: anh / video xong -> tai thang len Google Drive (trang Drive gia: thu muc du an, images, Videos)
      - name: Kiem thu dau-cuoi (trang Drive gia)
        timeout-minutes: 10
        run: node tests/e2e.js drive
      - name: Kiem thu dau-cuoi (quet thu muc, trang Muse gia)
        timeout-minutes: 10
        run: node tests/e2e.js quet

      # 1.3.4: giao dien voi 200 video xong khong phinh RAM (anh nho thay <video>, ve theo tung dong)
      - name: Kiem thu RAM giao dien
        timeout-minutes: 6
        run: node tests/giao-dien-ram.js

      - name: Dong goi
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Ban arm64 khong co chu ky hop le thi macOS bao "app bi hong".
      - name: Kiem chu ky
        run: |
          for app in dist/mac*/"AI Automation Studio.app"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Kiem du file .zip
        run: |
          VER=$(node -p "require('./package.json').version")
          for a in arm64 x64; do
            f="dist/AIAutomationStudio-$VER-mac-$a.zip"
            [ -f "$f" ] || { echo "::error::Thieu $f"; exit 1; }
          done
          ls -lh dist/*.zip

      - name: Dua anh chup giao dien len
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-chup-macos
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dua file len de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: AIAutomationStudio-macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
